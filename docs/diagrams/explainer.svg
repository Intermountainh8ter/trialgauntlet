<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='815' viewBox='0 0 1000 815' font-family='Inter, Helvetica Neue, Arial, sans-serif'>
<rect width='100%' height='100%' fill='#ffffff'/>
<rect x='0' y='0' width='1000' height='7' fill='#1d4ed8'/>
<text x='44.0' y='64.0' font-size='34' font-weight='700' fill='#13161a' text-anchor='start'>trialgauntlet</text>
<text x='44.0' y='90.0' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>Is the AI actually reliable, or did it just get lucky once?</text>
<line x1='44.0' y1='106.0' x2='956.0' y2='106.0' stroke='#e3e7ec' stroke-width='1.5'/>
<text x='44.0' y='140.0' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>THE QUESTION</text>
<text x='44.0' y='180.4' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>Most AI scorecards ask "did it succeed at least once?" That is</text>
<text x='44.0' y='210.9' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>a generous question. What happens if you ask "did it succeed</text>
<text x='44.0' y='241.3' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>every single time?"</text>
<text x='44.0' y='275.3' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE DID</text>
<text x='44.0' y='308.5' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>We built 138 realistic office tasks — fixing servers, correcting ledgers, changing</text>
<text x='44.0' y='331.7' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>settings — each with rules about what the AI is not allowed to do. Then we tested fake</text>
<text x='44.0' y='354.9' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>agents with known behaviour to check the scoring itself.</text>
<text x='44.0' y='384.9' font-size='15' font-weight='700' fill='#13161a' text-anchor='start'>A deliberately reckless agent, scored three different ways</text>
<text x='266.0' y='437.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Did it reach the right answer?</text>
<rect x='280.0' y='421.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='421.9' width='323.5' height='22.0' rx='4' fill='#b91c1c'/>
<text x='820.0' y='437.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>62% yes</text>
<text x='266.0' y='471.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Did it follow the rules?</text>
<rect x='280.0' y='455.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='455.9' width='2.0' height='22.0' rx='4' fill='#15803d'/>
<text x='820.0' y='471.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>0%</text>
<text x='266.0' y='505.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Scored by a sloppy grader</text>
<rect x='280.0' y='489.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='489.9' width='47.9' height='22.0' rx='4' fill='#b45309'/>
<text x='820.0' y='505.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>7-9% slipped through</text>
<text x='44.0' y='526.9' font-size='12.5' font-weight='400' fill='#5b6472' text-anchor='start'>The reckless agent takes every shortcut on purpose. A good scorecard should give it zero.</text>
<text x='44.0' y='560.9' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE FOUND</text>
<text x='44.0' y='598.9' font-size='30' font-weight='700' fill='#1d4ed8' text-anchor='start'>Right answer, wrong method, 62% of the time.</text>
<text x='44.0' y='628.9' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>An agent that broke every rule still landed on the correct outcome in up to 62% of</text>
<text x='44.0' y='652.8' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>tasks. The strict scorer caught it and gave it zero. A deliberately sloppy scorer</text>
<text x='44.0' y='676.7' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>let 7-9% through — and the tool raised a flag on its own scorer when that happened.</text>
<text x='44.0' y='710.7' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHY IT MATTERS</text>
<text x='44.0' y='744.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>A scorecard that only checks the final answer cannot tell skill from luck, or from</text>
<text x='44.0' y='768.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>cheating. This one ships proof of its own blind spot rather than hiding it.</text>
</svg>
